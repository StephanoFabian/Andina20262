spring.application.name=demoSM2

spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
# PostgreSQL local de esta rama
spring.datasource.url=jdbc:postgresql://localhost:5432/andina
spring.datasource.username=postgres
spring.datasource.password=postgre

# JWT: clave para firmar los tokens (HS512 necesita 64+ caracteres). En producción usar la variable JWT_SECRET.
jwt.secret=${JWT_SECRET:6xyQKeGSetHnlMKjMSI7j58kJayFRL2upPWW91h3HL9Aj32VTECmaixZy5xiQyhtl8xUgblNZ1XL38GOMVOwNnkwVT9aZO8HDt7JZjX1MXAXjQaavC21akqiJ02qiZ4V}
jwt.expiration-hours=8

# Limite local de ejecucion SQL, sin introducir otra capa de consultas.
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '5s'

# Videollamada e interpretación: claves locales por entorno, nunca en Angular.
andina.video.url=${ANDINA_VIDEO_URL:ws://localhost:7880}
andina.video.api-key=${ANDINA_VIDEO_API_KEY:}
andina.video.api-secret=${ANDINA_VIDEO_API_SECRET:}
andina.ia.url=${ANDINA_IA_URL:http://127.0.0.1:8095}
andina.ia.api-key=${ANDINA_IA_API_KEY:}

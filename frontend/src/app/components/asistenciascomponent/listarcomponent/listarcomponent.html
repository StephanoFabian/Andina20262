<section class="page">
  <app-encabezado modulo="asistencias" [total]="total()">
    @if(puedeEscribir()){<a mat-flat-button routerLink="/asistencias/insertar"
      ><mat-icon aria-hidden="true">add</mat-icon>Nuevo registro</a
    >}
  </app-encabezado>
  <div class="panel">
    <form class="table-tools" (ngSubmit)="buscar()">
      <mat-form-field appearance="outline"
        ><mat-label>Buscar por prefijo</mat-label
        ><input
          matInput
          [formControl]="busqueda"
          maxlength="100" /></mat-form-field
      ><button mat-flat-button class="boton-buscar" type="submit" [disabled]="cargando()">
        <mat-icon aria-hidden="true">search</mat-icon>Buscar
      </button>
    </form>
    @if(error()){
    <div class="notice error" role="alert">{{error()}}</div>
    }@if(cargando()){<mat-progress-bar mode="indeterminate" />}
    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="idAsistencia"
          ><th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell class="celda-id" *matCellDef="let row">
            {{row.idAsistencia ?? "—"}}
          </td></ng-container
        >
        <ng-container matColumnDef="idSesionVirtual"
          ><th mat-header-cell *matHeaderCellDef>Sesión virtual</th>
          <td mat-cell *matCellDef="let row">
            <app-nombre tipo="sesion" [id]="row.idSesionVirtual" /></td
        ></ng-container>
        <ng-container matColumnDef="idPersona"
          ><th mat-header-cell *matHeaderCellDef>Estudiante</th>
          <td mat-cell class="celda-principal" *matCellDef="let row">
            <app-nombre tipo="persona" [id]="row.idPersona" /></td
        ></ng-container>
        <ng-container matColumnDef="estado"
          ><th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let row">
            <app-chip [valor]="row.estado" /></td
        ></ng-container>
        <ng-container matColumnDef="acciones"
          ><th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let row">
            @if(puedeEscribir()){<a
              mat-icon-button
              [routerLink]="['/asistencias/editar',row.idAsistencia]"
              aria-label="Editar registro"
              ><mat-icon>edit</mat-icon></a
            ><button
              mat-icon-button
              (click)="eliminar(row)"
              aria-label="Eliminar registro"
            >
              <mat-icon>delete_outline</mat-icon></button
            >}
          </td></ng-container
        >
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row;columns:displayedColumns"></tr>
        <tr class="mat-mdc-row" *matNoDataRow>
          <td class="mat-mdc-cell celda-vacia" colspan="5">
            <app-estado-vacio
              entidad="asistencias"
              icono="fact_check"
              [cargando]="cargando()"
              [busqueda]="busqueda.value"
            />
          </td>
        </tr>
      </table>
    </div>
    <mat-paginator
      [length]="total()"
      [pageIndex]="page"
      [pageSize]="size"
      [pageSizeOptions]="[10,25,50,100]"
      (page)="paginar($event)"
    />
  </div>
</section>

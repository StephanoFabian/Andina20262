<section class="page narrow">
  <a class="back-link" routerLink="/perfiles-academicos"
    >← Volver a perfiles académicos</a
  >
  <h1>Perfiles académicos</h1>
  <div class="panel form-panel">
    @if(mensaje()){
    <p class="notice error" role="alert">{{mensaje()}}</p>
    }
    <form class="form-grid" [formGroup]="form" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline"
        ><mat-label>Detalle académico</mat-label
        ><input matInput type="text" formControlName="detallePA" /><mat-error
          >{{error('detallePA')}}</mat-error
        ></mat-form-field
      ><mat-form-field appearance="outline"
        ><mat-label>Nota</mat-label
        ><input matInput type="number" formControlName="notasPA" /><mat-error
          >{{error('notasPA')}}</mat-error
        ></mat-form-field
      >@if(form.hasError('rangoFechas')){
      <p class="notice error full-width">Revisa el rango de fechas.</p>
      }
      <div class="form-actions full-width">
        <button
          mat-flat-button
          type="submit"
          [disabled]="guardando() || cargando() || cargaFallida()"
        >
          Guardar registro</button
        ><a mat-stroked-button routerLink="/perfiles-academicos">Cancelar</a>
      </div>
    </form>
  </div>
</section>

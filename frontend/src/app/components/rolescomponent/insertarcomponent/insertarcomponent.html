<section class="page narrow">
  <a class="back-link" routerLink="/roles">← Volver a roles</a>
  <h1>Roles</h1>
  <div class="panel form-panel">
    @if(mensaje()){
    <p class="notice error" role="alert">{{mensaje()}}</p>
    }
    <form class="form-grid" [formGroup]="form" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline"
        ><mat-label>Rol</mat-label
        ><mat-select formControlName="detalle"
          ><mat-option [value]="'ADMIN'">ADMIN</mat-option
          ><mat-option [value]="'ADMIN_ESCUELA'">ADMIN ESCUELA</mat-option
          ><mat-option [value]="'ESPECIALISTA'">ESPECIALISTA</mat-option
          ><mat-option [value]="'LOCAL'">LOCAL</mat-option
          ><mat-option [value]="'DOCENTE'">DOCENTE</mat-option
          ><mat-option [value]="'ESTUDIANTE'"
            >ESTUDIANTE</mat-option
          ></mat-select
        ><mat-error>{{error('detalle')}}</mat-error></mat-form-field
      >@if(form.hasError('rangoFechas')){
      <p class="notice error full-width">Revisa el rango de fechas.</p>
      }
      <div class="form-actions full-width">
        <button
          mat-flat-button
          type="submit"
          [disabled]="guardando() || cargando() || cargaFallida()"
        >
          Guardar registro</button
        ><a mat-stroked-button routerLink="/roles">Cancelar</a>
      </div>
    </form>
  </div>
</section>

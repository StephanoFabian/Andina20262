<section class="page">
  <div class="page-heading">
    <div>
      <p class="eyebrow">GESTIÓN EDUCATIVA</p>
      <h1>Roles</h1>
    </div>
    @if(puedeEscribir()){<a mat-flat-button routerLink="/roles/insertar"
      >Nuevo registro</a
    >}
  </div>
  <div class="panel">
    <form class="table-tools" (ngSubmit)="buscar()">
      <mat-form-field appearance="outline"
        ><mat-label>Buscar por prefijo</mat-label
        ><input
          matInput
          [formControl]="busqueda"
          maxlength="100" /></mat-form-field
      ><button mat-stroked-button type="submit" [disabled]="cargando()">
        Buscar
      </button>
    </form>
    @if(error()){
    <div class="notice error" role="alert">{{error()}}</div>
    }@if(cargando()){<mat-progress-bar mode="indeterminate" />}
    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="idTipoPersona"
          ><th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let row">
            {{row.idTipoPersona ?? "—"}}
          </td></ng-container
        >
        <ng-container matColumnDef="detalle"
          ><th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let row">
            {{row.detalle ?? "—"}}
          </td></ng-container
        >
        <ng-container matColumnDef="acciones"
          ><th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let row">
            @if(puedeEscribir()){<a
              mat-icon-button
              [routerLink]="['/roles/editar',row.idTipoPersona]"
              aria-label="Editar registro"
              ><mat-icon>edit</mat-icon></a
            ><button
              mat-icon-button
              (click)="eliminar(row)"
              aria-label="Eliminar registro"
            >
              <mat-icon>delete_outline</mat-icon></button
            >}
          </td></ng-container
        >
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row;columns:displayedColumns"></tr>
        <tr class="mat-mdc-row" *matNoDataRow>
          <td class="mat-mdc-cell" colspan="3">No hay registros.</td>
        </tr>
      </table>
    </div>
    <mat-paginator
      [length]="total()"
      [pageIndex]="page"
      [pageSize]="size"
      [pageSizeOptions]="[10,25,50,100]"
      (page)="paginar($event)"
    />
  </div>
</section>

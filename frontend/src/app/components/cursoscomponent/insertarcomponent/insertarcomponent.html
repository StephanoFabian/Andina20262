<section class="page narrow">
  <a class="back-link" routerLink="/cursos">← Volver a cursos</a>
  <h1>Cursos</h1>
  <div class="panel form-panel">
    @if(mensaje()){
    <p class="notice error" role="alert">{{mensaje()}}</p>
    }
    <form class="form-grid" [formGroup]="form" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline"
        ><mat-label>Nombre del curso</mat-label
        ><input matInput type="text" formControlName="nombre_curso" /><mat-error
          >{{error('nombre_curso')}}</mat-error
        ></mat-form-field
      ><mat-form-field appearance="outline"
        ><mat-label>Descripción</mat-label
        ><textarea matInput rows="3" formControlName="descripcion"></textarea
        ><mat-error>{{error('descripcion')}}</mat-error></mat-form-field
      ><mat-form-field appearance="outline"
        ><mat-label>Área</mat-label
        ><input matInput type="text" formControlName="area" /><mat-error
          >{{error('area')}}</mat-error
        ></mat-form-field
      >@if(form.hasError('rangoFechas')){
      <p class="notice error full-width">Revisa el rango de fechas.</p>
      }
      <div class="form-actions full-width">
        <button
          mat-flat-button
          type="submit"
          [disabled]="guardando() || cargando() || cargaFallida()"
        >
          Guardar registro</button
        ><a mat-stroked-button routerLink="/cursos">Cancelar</a>
      </div>
    </form>
  </div>
</section>

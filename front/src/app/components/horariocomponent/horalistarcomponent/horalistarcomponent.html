<div class="container">
  <h2>Lista de Cursos</h2>
  <div>
    <!--Tabla-->
    <table mat-table [dataSource]="dataSource" class="mat-shadow-2">

   <!-- Position Column -->
  <ng-container matColumnDef="c1">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let element"> {{element.id_horario}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="c2">
    <th mat-header-cell *matHeaderCellDef> Cuando </th>
    <td mat-cell *matCellDef="let element"> {{element.diaSemana}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="c3">
    <th mat-header-cell *matHeaderCellDef> Inicio </th>
    <td mat-cell *matCellDef="let element"> {{element.horaInicio}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="c4">
    <th mat-header-cell *matHeaderCellDef> Fin </th>
    <td mat-cell *matCellDef="let element"> {{element.horaFin}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="c5">
    <th mat-header-cell *matHeaderCellDef> Que lo hara </th>
    <td mat-cell *matCellDef="let element"> {{element.idAsignacion}} </td>
  </ng-container>


  <!-- Weight Column -->
  <ng-container matColumnDef="c6">
    <th mat-header-cell *matHeaderCellDef> Curso </th>
    <td mat-cell *matCellDef="let element"> {{element.nombreCurso}} </td>
  </ng-container>


  <!-- Weight Column -->
  <ng-container matColumnDef="c7">
    <th mat-header-cell *matHeaderCellDef> Aula </th>
    <td mat-cell *matCellDef="let element"> {{element.nombreAula}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="c8">
    <th mat-header-cell *matHeaderCellDef> Pertenece </th>
    <td mat-cell *matCellDef="let element"> {{element.nombrePersona}} </td>
  </ng-container>


  <!-- Symbol Column -->
  <ng-container matColumnDef="c9">
    <th mat-header-cell *matHeaderCellDef> Borrar </th>
    <td mat-cell *matCellDef="let element">
        <button matIconButton class="btn-eliminar" (click)="eliminarHorario(element.id_horario)">
            <mat-icon>delete</mat-icon>
          </button>
    </td>
  </ng-container>
  <ng-container matColumnDef="c10">
    <th mat-header-cell *matHeaderCellDef> Modificar </th>
    <td mat-cell *matCellDef="let element">
        <button matIconButton class="btn-eliminar" [routerLink]="['/horario/editar', element.id_horario]">
            <mat-icon>edit</mat-icon>
          </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

  </div>
</div>

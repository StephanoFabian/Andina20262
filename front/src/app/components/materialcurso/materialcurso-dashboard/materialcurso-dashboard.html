<section class="pagina dashboard">
  <h1>Dashboard de materiales por curso</h1>
  <p class="nota">
    Cuántos materiales tiene cada curso, para decidir a qué cursos subir
    materiales primero.
  </p>

  @if (cursos().length > 0) {
  <div class="kpis" role="list" aria-label="Indicadores de materiales por curso">
    @for (k of kpis(); track k.etiqueta) {
    <article class="kpi" [class.kpi--alerta]="k.alerta" role="listitem">
      <p class="kpi-etiqueta">{{ k.etiqueta }}</p>
      <p class="kpi-valor">{{ k.valor }}</p>
      <p class="kpi-detalle">{{ k.detalle }}</p>
    </article>
    }
  </div>

  <div class="paneles">
    <figure class="panel">
      <h2>Cursos con menos materiales</h2>
      @if (cursos().length > limite) {
      <p class="nota">
        Se muestran los {{ limite }} cursos con menos materiales de
        {{ cursos().length }}; la tabla tiene todos.
      </p>
      }
      <div class="grafico-lienzo" [style.height]="altoGrafico()">
        <canvas
          baseChart
          type="bar"
          [data]="datosBarras()"
          [options]="opcionesBarras"
          role="img"
          [attr.aria-label]="
            'Gráfico de barras: materiales de los ' + visibles().length + ' cursos con menos materiales. ' + sinMateriales() + ' curso(s) sin materiales. El detalle está en la tabla.'
          "
        ></canvas>
      </div>
    </figure>
  </div>
  }

  <div class="acciones">
    <a mat-button routerLink="/materiales-cursos/reporte">Ver reporte por curso</a>
    <a mat-button routerLink="/materiales-cursos">Volver</a>
  </div>
</section>

<section class="page narrow">
  <a class="back-link" routerLink="/colegios">← Volver a colegios</a>
  <h1>Colegios</h1>
  <div class="panel form-panel">
    @if (mensaje()) {
      <p class="notice error" role="alert">{{ mensaje() }}</p>
    }
    <form class="form-grid" [formGroup]="form" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" maxlength="30" />
        <mat-error>{{ error('nombre') }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Departamento</mat-label>
        <input matInput formControlName="departamento" maxlength="30" />
        <mat-error>{{ error('departamento') }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Provincia</mat-label>
        <input matInput formControlName="provincia" maxlength="30" />
        <mat-error>{{ error('provincia') }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Distrito</mat-label>
        <input matInput formControlName="distrito" maxlength="30" />
        <mat-error>{{ error('distrito') }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Comunidad</mat-label>
        <input matInput formControlName="comunidad" maxlength="30" />
        <mat-error>{{ error('comunidad') }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Tipo de zona</mat-label>
        <input matInput formControlName="tipo_zona" maxlength="30" placeholder="Ej. Urbana o Rural" />
        <mat-error>{{ error('tipo_zona') }}</mat-error>
      </mat-form-field>

      <div class="form-actions full-width">
        <button
          mat-flat-button
          type="submit"
          [disabled]="guardando() || cargando() || cargaFallida()"
        >
          Guardar registro
        </button>
        <a mat-stroked-button routerLink="/colegios">Cancelar</a>
      </div>
    </form>
  </div>
</section>

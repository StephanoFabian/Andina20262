<div class="container">
    <div>
        <h2>Formulario de Actualización de Curso</h2>
    </div>
    <div>
        <form [formGroup]="formCurso" (ngSubmit)="actualizarCurso()">
              <mat-form-field class="example-full-width">
                <mat-label>Código</mat-label>
                <input matInput type="number" formControlName="codigo" readonly>
            </mat-form-field>
            <br>
            <mat-form-field class="example-full-width">
                <mat-label>Nombre del Curso</mat-label>
                <input matInput placeholder="Aritmetica" formControlName="nombre">
            </mat-form-field>
            <br>
            <mat-form-field class="example-full-width">
                <mat-label>Descripción</mat-label>
                <textarea matInput placeholder="Descubre operaciones..." formControlName="descripcion"></textarea>
            </mat-form-field>
            <br>
            <mat-form-field class="example-full-width">
                <mat-label>Area</mat-label>
                <input matInput placeholder="Matemáticas" formControlName="area">
            </mat-form-field>          

            <button matButton type="submit">Guardar</button>

        </form>
        <p>{{ mensaje }}</p>
    </div>
</div>

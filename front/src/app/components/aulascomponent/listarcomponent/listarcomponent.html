<section class="page">
  <app-encabezado modulo="aulas" [total]="total()">
    @if (puedeEscribir()) {
      <a mat-flat-button routerLink="/aulas/insertar">
        <mat-icon aria-hidden="true">add</mat-icon>Nuevo registro
      </a>
    }
  </app-encabezado>

  <div class="panel">
    <form class="table-tools" (ngSubmit)="buscar()">
      <mat-form-field appearance="outline">
        <mat-label>Buscar por prefijo</mat-label>
        <input matInput [formControl]="busqueda" maxlength="100" />
      </mat-form-field>
      <button mat-flat-button class="boton-buscar" type="submit" [disabled]="cargando()">
        <mat-icon aria-hidden="true">search</mat-icon>Buscar
      </button>
    </form>

    @if (error()) {
      <div class="notice error" role="alert">{{ error() }}</div>
    }
    @if (cargando()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="idAula">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell class="celda-id" *matCellDef="let row">
            {{ row.idAula ?? '—' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell class="celda-principal" *matCellDef="let row">
            {{ row.nombre }}
          </td>
        </ng-container>

        <ng-container matColumnDef="seccion">
          <th mat-header-cell *matHeaderCellDef>Sección</th>
          <td mat-cell *matCellDef="let row">{{ row.seccion }}</td>
        </ng-container>

        <ng-container matColumnDef="capacidad">
          <th mat-header-cell *matHeaderCellDef>Capacidad</th>
          <td mat-cell *matCellDef="let row">{{ row.capacidad }}</td>
        </ng-container>

        <ng-container matColumnDef="idColegio">
          <th mat-header-cell *matHeaderCellDef>Colegio</th>
          <td mat-cell *matCellDef="let row">
            <app-nombre tipo="colegio" [id]="row.idColegio" />
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let row">
            @if (puedeEscribir()) {
              <a
                mat-icon-button
                [routerLink]="['/aulas/editar', row.idAula]"
                aria-label="Editar registro"
              >
                <mat-icon>edit</mat-icon>
              </a>
              <button
                mat-icon-button
                (click)="eliminar(row)"
                aria-label="Eliminar registro"
              >
                <mat-icon>delete_outline</mat-icon>
              </button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-mdc-row" *matNoDataRow>
          <td class="mat-mdc-cell celda-vacia" colspan="6">
            <app-estado-vacio
              entidad="aulas"
              icono="meeting_room"
              [cargando]="cargando()"
              [busqueda]="busqueda.value"
            />
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [length]="total()"
      [pageIndex]="page"
      [pageSize]="size"
      [pageSizeOptions]="[10, 25, 50, 100]"
      (page)="paginar($event)"
    />
  </div>
</section>

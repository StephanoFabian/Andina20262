<section class="page">
  <app-encabezado modulo="detalles-matricula" [total]="total()">
    <div>
      <a mat-stroked-button routerLink="/detalles-matricula/reportes"
        ><mat-icon aria-hidden="true">bar_chart</mat-icon>Reportes</a
      >
      @if(puedeEscribir()){<a
        mat-flat-button
        routerLink="/detalles-matricula/insertar"
        ><mat-icon aria-hidden="true">add</mat-icon>Nuevo registro</a
      >}
    </div>
  </app-encabezado>
  <div class="panel">
    <form class="table-tools" (ngSubmit)="buscar()">
      <mat-form-field appearance="outline"
        ><mat-label>Buscar por prefijo</mat-label
        ><input
          matInput
          [formControl]="busqueda"
          maxlength="100" /></mat-form-field
      ><button mat-flat-button class="boton-buscar" type="submit" [disabled]="cargando()">
        <mat-icon aria-hidden="true">search</mat-icon>Buscar
      </button>
    </form>
    @if(error()){
    <div class="notice error" role="alert">{{error()}}</div>
    }@if(cargando()){<mat-progress-bar mode="indeterminate" />}
    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="idDetalleMatricula"
          ><th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell class="celda-id" *matCellDef="let row">
            {{row.idDetalleMatricula ?? "—"}}
          </td></ng-container
        >
        <ng-container matColumnDef="fechaMatricula"
          ><th mat-header-cell *matHeaderCellDef>Fecha de matrícula</th>
          <td mat-cell *matCellDef="let row">
            {{row.fechaMatricula | fechaPe}}
          </td></ng-container
        >
        <ng-container matColumnDef="estado"
          ><th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let row">
            <app-chip [valor]="row.estado" /></td
        ></ng-container>
        <ng-container matColumnDef="idMatricula"
          ><th mat-header-cell *matHeaderCellDef>Matrícula</th>
          <td mat-cell class="celda-principal" *matCellDef="let row">
            <app-nombre tipo="matricula" [id]="row.idMatricula" /></td
        ></ng-container>
        <ng-container matColumnDef="idCurso"
          ><th mat-header-cell *matHeaderCellDef>Curso</th>
          <td mat-cell *matCellDef="let row">
            <app-curso-chip [id]="row.idCurso" /></td
        ></ng-container>
        <ng-container matColumnDef="idPeriodo"
          ><th mat-header-cell *matHeaderCellDef>Periodo académico</th>
          <td mat-cell *matCellDef="let row">
            <app-nombre tipo="periodo" [id]="row.idPeriodo" /></td
        ></ng-container>
        <ng-container matColumnDef="idGrado"
          ><th mat-header-cell *matHeaderCellDef>Grado</th>
          <td mat-cell *matCellDef="let row">
            <app-nombre tipo="grado" [id]="row.idGrado" /></td
        ></ng-container>
        <ng-container matColumnDef="acciones"
          ><th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let row">
            @if(puedeEscribir()){<a
              mat-icon-button
              [routerLink]="['/detalles-matricula/editar',row.idDetalleMatricula]"
              aria-label="Editar registro"
              ><mat-icon>edit</mat-icon></a
            ><button
              mat-icon-button
              (click)="eliminar(row)"
              aria-label="Eliminar registro"
            >
              <mat-icon>delete_outline</mat-icon></button
            >}
          </td></ng-container
        >
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row;columns:displayedColumns"></tr>
        <tr class="mat-mdc-row" *matNoDataRow>
          <td class="mat-mdc-cell celda-vacia" colspan="8">
            <app-estado-vacio
              entidad="detalles de matrícula"
              icono="assignment"
              [cargando]="cargando()"
              [busqueda]="busqueda.value"
            />
          </td>
        </tr>
      </table>
    </div>
    <mat-paginator
      [length]="total()"
      [pageIndex]="page"
      [pageSize]="size"
      [pageSizeOptions]="[10,25,50,100]"
      (page)="paginar($event)"
    />
  </div>
</section>

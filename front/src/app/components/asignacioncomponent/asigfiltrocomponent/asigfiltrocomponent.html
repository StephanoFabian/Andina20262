<div class="container">

    <h2>Buscar Cursos por Area</h2>

    <mat-form-field appearance="outline">
        <mat-label>Seleccione el Area a buscar</mat-label>

    <input matInput placeholder="Minimo rango" type="number" [(ngModel)]="minimo">
    <input matInput placeholder="Maximo rango" type="number" [(ngModel)]="maximo">

    </mat-form-field>

    <button mat-raised-button color="primary" (click)="buscarentreHoras()">
        Buscar
    </button>

    @if (mensaje) {
    <p>{{ mensaje }}</p>
    }

    @if (dataSource.length > 0) {

    <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
        <ng-container matColumnDef="c1">
            <th mat-header-cell *matHeaderCellDef> ID </th>
            <td mat-cell *matCellDef="let element"> {{element.idStreaming}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="c2">
            <th mat-header-cell *matHeaderCellDef> Streamming </th>
            <td mat-cell *matCellDef="let element"> {{element.nameStreaming}} </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="c3">
            <th mat-header-cell *matHeaderCellDef> Fecha de Lanzamiento </th>
            <td mat-cell *matCellDef="let element"> {{element.launchDateStreaming}} </td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="c4">
            <th mat-header-cell *matHeaderCellDef> Precio </th>
            <td mat-cell *matCellDef="let element"> {{element.priceStreaming}} </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    }
</div>

<div class="container">
  <h2>Lista de Asignaciones</h2>
  <div>
    <!--Tabla-->
    <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
        
  <!-- Position Column -->
  <ng-container matColumnDef="c1">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let element"> {{element.id_asignacion}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="c2">
    <th mat-header-cell *matHeaderCellDef> Aula </th>
    <td mat-cell *matCellDef="let element"> {{element.id_aula}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="c3">
    <th mat-header-cell *matHeaderCellDef> Curso </th>
    <td mat-cell *matCellDef="let element"> {{element.id_curso}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="c4">
    <th mat-header-cell *matHeaderCellDef> Modalidad </th>
    <td mat-cell *matCellDef="let element"> {{element.modalidad}} </td>
  </ng-container>
  <!-- Weight Column -->
  <ng-container matColumnDef="c5">
    <th mat-header-cell *matHeaderCellDef> Horas(sem) </th>
    <td mat-cell *matCellDef="let element"> {{element.horassemanales}} </td>
  </ng-container>
  <!-- Weight Column -->
  <ng-container matColumnDef="c6">
    <th mat-header-cell *matHeaderCellDef> Persona </th>
    <td mat-cell *matCellDef="let element"> {{element.id_persona}} </td>
  </ng-container>
  <!-- Weight Column -->
  <ng-container matColumnDef="c7">
    <th mat-header-cell *matHeaderCellDef> Periodo </th>
    <td mat-cell *matCellDef="let element"> {{element.id_periodo}} </td>
  </ng-container>
  <!-- Weight Column -->
  <ng-container matColumnDef="c8">
    <th mat-header-cell *matHeaderCellDef> Colegio </th>
    <td mat-cell *matCellDef="let element"> {{element.id_colegio}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="c9">
    <th mat-header-cell *matHeaderCellDef> Borrar </th>
    <td mat-cell *matCellDef="let element">
        <button matIconButton class="btn-eliminar" (click)="eliminarasignacion(element.id_asignacion)">
            <mat-icon>delete</mat-icon>
          </button>
    </td>
  </ng-container>
  <ng-container matColumnDef="c10">
    <th mat-header-cell *matHeaderCellDef> Modificar </th>
    <td mat-cell *matCellDef="let element">
        <button matIconButton class="btn-eliminar" [routerLink]="['/asignacion/editar', element.id_asignacion]">
            <mat-icon>edit</mat-icon>
          </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

  </div>
</div>
